[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gt-toolkit"
version = "0.1.0"
description = "Portable, CLI-agnostic deterministic tools for fine-grained memory-safety ground-truth generation."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Enables the advisory `gt-toolkit validate --jsonschema` cross-check.
jsonschema = ["jsonschema>=4.0"]

[project.scripts]
gt-toolkit = "gt_toolkit.cli:main"

[tool.setuptools]
# Only package the portable core; this is a monorepo, not a single package.
packages = ["gt_toolkit"]

[tool.setuptools.package-data]
gt_toolkit = ["schema/*.json", "gdb_recorder.py"]
